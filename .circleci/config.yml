version: 2

jobs:
  build:
      docker:
        - image: cimg/python:3.12.13
          environment:
            TEST_DATABASE_URL: postgresql://postgres@localhost/circle_test
        - image: cimg/postgres:17.7
          environment:
            POSTGRES_USER: postgres

      steps:
        - checkout
        - run:
            command:
              pip install tox
        - run: tox
